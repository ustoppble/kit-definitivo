<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 84 1080 452" width="1080" height="452" role="img" aria-labelledby="x4t x4d">
<title id="x4t">As 7 sequências do Kit e quando cada uma roda</title>
<desc id="x4d">Bloco de cima, que roda sempre: quem chega ao checkout e não paga entra no Carrinho Abandonado; quem compra segue para Boas-vindas, UpSell 2X e High Ticket. Bloco de baixo, condicional, com borda tracejada: quem se inscreve num evento entra em paralelo nas sequências de Lançamento, Leads Aquecidos e Leads Gratuitos, e a Lançamento leva essa gente ao checkout do bloco de cima.</desc>
